  uploadPostMedia(customPost: UploadPostMediaInput!): CustomPostType
  upsertCustomPostRepeatSettings(customPostRepeatSettings: UpsertCustomPostRepeatSettingsInput!): CustomPostRepeatSettingsType
}

type PostingQuery {
  customPost(customPostId: Int): CustomPostType
  customPostRepeatSettings(customPostRepeatSettings: GetCustomPostRepeatSettingsInput!): CustomPostRepeatSettingsType
