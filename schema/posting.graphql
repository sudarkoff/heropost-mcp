  customPostsScheduledViaRepeat(filter: GetCustomPostsScheduledViaRepeatInput!): [CustomPostType]
  facebookPages(accountId: Int, name: String): [FacebookPageType]
  fileInfo(file: GetFileInfoInput!): FileInfoType
  mediaFromUrl(customPostItemMedia: GetMediaFromUrlInput!): MediaFromUrlType
  mediaList(filter: MediaFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeMediaType
  mentionSuggestions(filter: GetMentionSuggestionsInput!): [MentionSuggestionType]
  postingErrors: [PostingErrorType]
  preSignedMediaUploadUrl(media: GetPreSignedMediaUploadUrlInput!): PreSignedMediaUploadUrlType
  preSignedUrlForPostItemMedia(customPostItemMedia: GetPreSignedUrlForPostItemMediaInput!): PreSignedUrlForPostItemMediaType
}

