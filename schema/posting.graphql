  updateCustomPostItem(customPostItem: UpdateCustomPostItemInput!): CustomPostItemType
  updateMedia(media: UpdateMediaInput!): MediaType
  updatePostItemMedia(customPostItemMedia: UpdatePostItemMediaInput!): CustomPostItemType
