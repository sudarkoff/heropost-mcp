type MainMutation {
  acceptTeamInvite(token: String!): WorkspaceMemberType
  addAuthorToFavorites(addAuthorToFavorites: AddAuthorToFavoritesInput!): PostAuthorType
  addPostComment(comment: CreatePostCommentInput!): PostCommentType
  attachToken(data: AttachTokenInput!): TokenType
  bulkUploadCsv(bulkUploadCsv: BulkUploadCsvInput!): BulkUploadType

  """
  Exchange an OAuth code from the LinkedIn inbox app (Community Management API) and store the tokens on the account
  """
  connectLinkedInInbox(input: ConnectLinkedInInboxInput!): Boolean
  createAccount(account: CreateAccountInput!): AccountType
  createAutomation(automation: CreateAutomationInput!): AutomationType
  createDraftPostsFromBulkUpload(createDraftPosts: CreateDraftPostsFromBulkUploadInput!): Int
  createPostFromAutomationItem(automationItem: CreatePostFromAutomationItemInput!): Int
  createPostingGroup(postingGroup: CreatePostingGroupInput!): PostingGroupType
  createTeamInvite(invite: CreateWorkspaceInviteInput!): WorkspaceInviteType
  createToken(token: CreateTokenInput!): TokenType
  createUpdateProfile(profile: CreateUpdateProfileInput!): ProfileType
  createWorkspace(workspace: CreateWorkspaceInput!): WorkspaceType

  """Create an invitation token for public workspace access"""
  createWorkspaceAccessToken(token: CreateWorkspaceAccessTokenInput!): WorkspaceAccessTokenType
  declineTeamInvite(token: String!): Boolean
  deleteAutomation(automation: DeleteAutomationInput!): Int
  deleteNotifications(notificationIds: [Int]): [Int]
  deletePostComment(commentId: Int!): Boolean
  deletePostingGroup(postingGroup: DeletePostingGroupInput!): Int
  deleteText(text: DeleteTextInput!): Int
  deleteWatermark(watermark: DeleteWatermarkInput!): Boolean
  deleteWorkspace(id: Int): Int
  duplicateCustomPost(customPost: DuplicateCustomPostInput!): CustomPostType
  insertText(text: InsertTextInput!): TextType
  likeInboxComment(messageId: Int!): Boolean
  markInboxThreadDone(threadId: Int!): Boolean
  markInboxThreadRead(threadId: Int!): Boolean

  """Create account with public access (requires workspace access token)"""
  publicCreateAccount(accessToken: PublicAccessTokenInput!, account: CreateAccountInput!): AccountType

  """Create token with public access (requires workspace access token)"""
  publicCreateToken(accessToken: PublicAccessTokenInput!, token: CreateTokenInput!): TokenType
  pullAutomation(automationId: Int!): AutomationType
  removeAccountFromPlatform(accountId: Int): Int
  removeAuthorFromFavorites(removeAuthorFromFavorites: RemoveAuthorFromFavoritesInput!): PostAuthorType
  removeTeamMember(memberId: Int!): Boolean
  replyToInboxThread(input: ReplyToInboxThreadInput!): InboxMessageQueryType
  reviewPostApproval(review: ReviewApprovalInput!): PostApprovalType
  revokeTeamInvite(inviteId: Int!): Boolean
  selectAccountsForCalendarView(workspace: SelectAccountsForCalendarViewInput!): WorkspaceType
  setPrivateApiCreds(privateApiCreds: SetPrivateApiCredsInput!): AccountType
  submitFeedback(feedback: SubmitFeedbackInput!): FeedbackType
  submitPostForApproval(customPostId: Int!): PostApprovalType
  toggleInboxBookmark(threadId: Int!): Boolean
  unselectAccountsForCalendarView(workspace: UnselectAccountsForCalendarViewInput!): WorkspaceType
  updateAccount(account: UpdateAccountInput!): AccountType
  updateAutomation(automation: UpdateAutomationInput!): AutomationType
  updatePostingGroup(postingGroup: UpdatePostingGroupInput!): PostingGroupType
  updateTeamMemberRole(member: UpdateMemberRoleInput!): WorkspaceMemberType
  updateTeamNotificationPreferences(preferences: UpdateTeamNotificationPreferenceInput!): TeamNotificationPreferenceType
  updateText(text: UpdateTextInput!): TextType
  updateWorkspace(workspace: UpdateWorkspaceInput!): WorkspaceType
  uploadProfileAvatar(file: Upload, userId: ID): String
  uploadWorkspaceLogo(file: Upload, workspaceId: Int): String
  upsertWatermark(watermark: UpsertWatermarkInput!): WatermarkType
  viewNotifications(workspaceId: Int): ListModelTypeNotificationType
}

type MainQuery {
  account(id: Int): AccountType
  accountSnapshots(filter: GetAccountSnapshotsInput!): [AccountSnapshotType]
  accounts(filter: AccountFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeAccountType
  automation(automation: GetAutomationInput!): AutomationType
  automationItemList(filter: AutomationItemFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeAutomationItemType
  automationList(filter: AutomationFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeAutomationType
  bulkUploadStatus(bulkUploadStatus: BulkUploadStatusInput!): BulkUploadStatusType
  customPosts(filter: CustomPostFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeCustomPostType
  customPostsScheduledViaRepeat(filter: GetCustomPostsScheduledViaRepeatInput!): [CustomPostType]
  facebookPages(accountId: Int, name: String): [FacebookPageType]
  favoriteAccounts(filter: PostAuthorFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int, workspaceId: Int): ListModelTypePostAuthorType
  getPostAnalyticsDownloadUrl(filter: GetPostAnalyticsDownloadUrlInput!): PostAnalyticsDownloadUrlType
  getXRequestToken(returnUrl: String): String
  inboxThread(threadId: Int!): InboxThreadQueryType
  inboxThreads(filter: InboxThreadFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int, workspaceId: Int): ListModelTypeInboxThreadQueryType
  mentionSuggestions(filter: GetMentionSuggestionsInput!): [MentionSuggestionType]
  notifications(filter: NotificationFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int, workspaceId: Int): ListModelTypeNotificationType
  planUsage: PlanUsageType
  postAnalytics(filter: GetPostAnalyticsInput): [PostAnalyticsType]
  postAnalyticsRaw(filter: GetPostAnalyticsRawInput): [PostAnalyticsRawType]
  postComments(workspaceId: Int!): [PostCommentType]
  postingGroupList(filter: PostingGroupFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypePostingGroupType
  profile(userId: Guid): ProfileType

  """
  Get X request token with public access (requires workspace access token)
  """
  publicGetXRequestToken(accessToken: PublicAccessTokenInput!, returnUrl: String): String

  """
  Get social accounts with public access (requires workspace access token)
  """
  publicSocialAccounts(accessToken: PublicAccessTokenInput!, token: SocialAccountFilterInput): ListModelTypeSocialAccountType
  publicSystemSettings(filter: SystemSettingFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeSystemSettingType
  searchKeywordsByString(searchString: String): [String]
  searchPosts(filter: PostFilterInput, keywords: [String], skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int, workspaceId: Int): ListModelTypePostType
  social(id: Int): SocialType
  socialAccounts(token: SocialAccountFilterInput): ListModelTypeSocialAccountType
  socials(filter: SocialFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeSocialType
  systemSetting(social: SocialEnum): SystemSettingType
  systemSettings(filter: SystemSettingFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeSystemSettingType
  teamApprovals(status: PostApprovalStatus, workspaceId: Int!): [PostApprovalType]
  teamMembers(workspaceId: Int!): [WorkspaceMemberType]
  teamNotificationPreferences(workspaceId: Int!): TeamNotificationPreferenceType
  teamPendingInvites(workspaceId: Int!): [WorkspaceInviteType]
  textList(filter: TextFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeTextType
  topRelatedAccountPosts(filter: PostFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int, userId: String): ListModelTypePostType
  topRelatedAccounts(filter: PostAuthorFilterInput, keywords: [String], skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int, workspaceId: Int): ListModelTypePostAuthorType
  watermark(watermark: GetWatermarkInput!): WatermarkType
  workspace(id: Int): WorkspaceType
  workspaceKeywords(workspaceId: Int): ListModelTypeWorkspaceKeywordType
  workspaces(filter: WorkspaceFilterInput, skip: Int, sortDirection: SortDirectionEnum, sortField: String, take: Int): ListModelTypeWorkspaceType
  xCreditBalance: XCreditBalanceType
}

